name: Issue management - remove labels as needed

on:
  # Author replies require this trigger. The job only changes labels using
  # repository/issue metadata, without checking out code or using comment content.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  issue_comment:
    permissions:
      issues: write # to remove labels from issues
      pull-requests: write # to remove labels from pull requests
    if: >
      contains(github.event.issue.labels.*.name, 'needs author feedback') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    steps:
      - name: Remove labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit --remove-label "needs author feedback" "$ISSUE_NUMBER"
          gh issue edit --remove-label "stale" "$ISSUE_NUMBER"
